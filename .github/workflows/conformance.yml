name: conformance

# Verifies the pure-organ contract for organ-ae-adapters-sales-adapter:
#   decide(state, context) -> {output, rationale, self_metric}
# deterministic, fail-safe, stdlib-only. Runs the pytest suite (with pytest
# explicitly installed — organ repos that run `python -m pytest` without
# installing it go RED with "No module named pytest") and exercises the organ
# against its samples + the contract checker.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Check pure-organ signature
        run: |
          python -c "
          import inspect
          from organ import decide
          params = list(inspect.signature(decide).parameters.keys())
          assert params[:2] == ['state', 'context'], f'bad signature: {params}'
          print('OK signature: decide(state, context)')
          "

      - name: Check fail-safe on empty state
        run: |
          python -c "
          from organ import decide
          r = decide({}, {})
          assert set(r) == {'output', 'rationale', 'self_metric'}, r.keys()
          assert isinstance(r['output']['candidates'], list)
          c = r['self_metric']['confidence']
          assert 0.0 <= c <= 1.0, c
          print(f'OK fail-safe (confidence {c})')
          "

      - name: Check determinism
        run: |
          python -c "
          from organ import decide
          state = {'pipeline_rows': [
              {'tenant_id': 1, 'tenant_slug': 'a', 'display_name': 'Alpha',
               'pipeline_state': {'stage': 'proposal', 'stage_changed_at': '2026-06-01T00:00:00',
                                  'deal_value_estimate_usd': 2500, 'deal_value_currency': 'GBP'}}]}
          ctx = {'now': '2026-06-11T00:00:00'}
          assert decide(state, ctx) == decide(state, ctx)
          print('OK deterministic')
          "

      - name: Check stdlib-only (no external imports)
        run: |
          python -c "
          import ast
          stdlib_allowed = {'json', 're', 'sys', 'os', 'typing', '__future__', 'datetime'}
          tree = ast.parse(open('organ.py').read())
          found = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found += [a.name.split('.')[0] for a in node.names]
              elif isinstance(node, ast.ImportFrom):
                  if node.module:
                      found.append(node.module.split('.')[0])
          external = sorted({m for m in found if m not in stdlib_allowed})
          assert not external, f'non-stdlib imports: {external}'
          print(f'OK stdlib-only (imports: {sorted(set(found))})')
          "

      - name: Run pytest suite
        run: python -m pytest test_organ.py -v --tb=short

      - name: Check connection ports (CONNECTORS.md stud standard)
        run: |
          # Asserts ports.json parses, every declared `type` exists in the
          # shared vocabulary (types.json), and decide() actually reads each
          # declared input name + writes each declared output name, sampled
          # against the organ's own samples. See orchestrator/CONNECTORS.md.
          python ports_check.py

      - name: Run organ against samples + contract checker
        run: |
          set -euo pipefail
          echo "# Sales Adapter Organ — Conformance Report" >> "$GITHUB_STEP_SUMMARY"
          for sample in samples/*.json; do
            name="$(basename "$sample" .json)"
            echo "## Sample: $name" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python organ.py < "$sample" | tee /tmp/out.json | python -m json.tool >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python conformance_check.py "$name" < /tmp/out.json
          done
